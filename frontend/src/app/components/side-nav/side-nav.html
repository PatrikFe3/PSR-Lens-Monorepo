<mat-drawer-container class="example-container">

    <mat-drawer mode="side" opened>
        <div class="matDrawerWrapper">
            <h1>PSR Print Studio</h1>
            <mat-nav-list>
                <mat-nav-list>
                    <a mat-list-item routerLink="/Studio">
                        <mat-icon matListItemIcon aria-hidden="true">view_in_ar</mat-icon>
                        <span matListItemTitle>New design</span>
                    </a>
                    <a mat-list-item routerLink="/viewer">
                        <mat-icon matListItemIcon aria-hidden="true">add_box</mat-icon>
                        <span matListItemTitle>View design</span>
                    </a>
                    <a mat-list-item routerLink="/about">
                        <mat-icon matListItemIcon aria-hidden="true">info</mat-icon>
                        <span matListItemTitle>About</span>
                    </a>
                    <a mat-list-item routerLink="/settings">
                        <mat-icon matListItemIcon aria-hidden="true">settings</mat-icon>
                        <span matListItemTitle>Settings</span>
                    </a>
                </mat-nav-list>
                <mat-button-toggle-group name="fontStyle" aria-label="Color theme" [value]="colorTheme.theme()"
                    (change)="onThemeChange($event.value)">

                    <mat-button-toggle value="light-theme" aria-label="Light Mode"><mat-icon matListItemIcon
                            aria-hidden="true">light_mode</mat-icon>Light</mat-button-toggle>

                    <mat-button-toggle value="dark-theme" aria-label="Dark Mode"><mat-icon matListItemIcon
                            aria-hidden="true">dark_mode</mat-icon>Dark</mat-button-toggle>

                </mat-button-toggle-group>
            </mat-nav-list>
        </div>
    </mat-drawer>

    <mat-drawer-content>
        <router-outlet></router-outlet>
    </mat-drawer-content>

</mat-drawer-container>
