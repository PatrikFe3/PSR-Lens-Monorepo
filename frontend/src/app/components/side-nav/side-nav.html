<mat-drawer-container class="example-container">

    <mat-drawer #drawer class="shell_nav" [mode]="compact() ? 'over' : 'side' " [opened]="!compact()">

        <nav class="nav" aria-label="Main navigation">
            <p class="brand">PSR Print Studio</p>
            <mat-nav-list>
                <a mat-list-item routerLink="/studio" routerLinkActive="is-active" ariaCurrentWhenActive="page"
                    (click)="closeIfCompact(drawer)">
                    <mat-icon matListItemIcon aria-hidden="true">
                        view_in_ar
                    </mat-icon>
                    <span matListItemTitle>New design</span>
                </a>
                <a mat-list-item routerLink="/viewer" routerLinkActive="is-active" ariaCurrentWhenActive="page"
                    (click)="closeIfCompact(drawer)">
                    <mat-icon matListItemIcon aria-hidden="true">
                        add_box
                    </mat-icon>
                    <span matListItemTitle>Assembled design</span>
                </a>
                <a mat-list-item routerLink="/about" routerLinkActive="is-active" ariaCurrentWhenActive="page"
                    (click)="closeIfCompact(drawer)">
                    <mat-icon matListItemIcon aria-hidden="true">info</mat-icon>
                    <span matListItemTitle>About</span>
                </a>
                <a mat-list-item routerLink="/settings" routerLinkActive="is-active" ariaCurrentWhenActive="page"
                    (click)="closeIfCompact(drawer)">
                    <mat-icon matListItemIcon aria-hidden="true">settings</mat-icon>
                    <span matListItemTitle>Settings</span>
                </a>
            </mat-nav-list>
            <mat-button-toggle-group class="theme" aria-label="Color theme" [value]="colorTheme.theme()"
                (change)="onThemeChange($event.value)">

                <mat-button-toggle value="light-theme" aria-label="Light Mode"><mat-icon matListItemIcon
                        aria-hidden="true">light_mode</mat-icon>Light</mat-button-toggle>
                <mat-button-toggle value="dark-theme" aria-label="Dark Mode"><mat-icon matListItemIcon
                        aria-hidden="true">dark_mode</mat-icon>Dark</mat-button-toggle>
            </mat-button-toggle-group>
        </nav>
    </mat-drawer>

    <mat-drawer-content class="shell__content">
        @if (compact()) {
        <mat-toolbar class="topbar">
            <button mat-icon-button type="button" aria-label="Open navigation" [attr.aria-expanded]="drawer.opened"
                (click)="drawer.toggle()">
                <mat-icon aria-hidden="true">menu</mat-icon>
            </button>
            <span class="topbar__title">PSR Print Studio</span>
        </mat-toolbar>
        }
        <main class="page" id="main"><router-outlet></router-outlet></main>
    </mat-drawer-content>
</mat-drawer-container>
