<mat-drawer-container class="example-container">

    <mat-drawer mode="side" opened>
        <mat-nav-list>
            <a mat-list-item routerLink="/analysis">
                <mat-icon matListItemIcon aria-hidden="true">add_box</mat-icon>
                <span matListItemTitle>New Subject</span>
            </a>
            <a mat-list-item routerLink="/about">
                <mat-icon matListItemIcon aria-hidden="true">info</mat-icon>
                <span matListItemTitle>About</span>
            </a>
            <a mat-list-item routerLink="/settings">
                <mat-icon matListItemIcon aria-hidden="true">settings</mat-icon>
                <span matListItemTitle>Settings</span>
            </a>
        </mat-nav-list>
        <mat-button-toggle-group name="fontStyle" aria-label="Font Style">

            <mat-button-toggle value="light" aria-label="Light Mode"><mat-icon matListItemIcon
                    aria-hidden="true">light_mode</mat-icon>Light</mat-button-toggle>

            <mat-button-toggle value="dark" aria-label="Dark Mode"><mat-icon matListItemIcon
                    aria-hidden="true">dark_mode</mat-icon>Dark</mat-button-toggle>

        </mat-button-toggle-group>
    </mat-drawer>

    <mat-drawer-content>
        <router-outlet></router-outlet>
    </mat-drawer-content>

</mat-drawer-container>
