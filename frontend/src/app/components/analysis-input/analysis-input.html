<div class="main-Input">
    <mat-form-field class="messageField" appearance="outline">
        <mat-label>Paste your Message</mat-label>
        <textarea matInput [(ngModel)]="emailContent" rows="8"></textarea>
    </mat-form-field>
    
    <button matButton="filled" (click)="onAnalyze()" class="analyzeBtn">Analyze</button>
</div>
